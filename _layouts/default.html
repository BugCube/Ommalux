<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10171e">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Ommalux</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="icon" type="image/png" href="{{ '/assets/ommalux-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/ommalux-icon.png' | relative_url }}" width="42" height="42" alt=""><span>Ommalux</span></a>
    <nav aria-label="Main navigation"><a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a><a href="{{ '/impressum/' | relative_url }}">Imprint</a></nav>
  </header>
  <main id="main" class="wrap {% unless page.home %}document{% endunless %}">{{ content }}</main>
  <footer class="site-footer wrap"><span>Ommalux · by Wacholder</span><nav aria-label="Footer navigation"><a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a><a href="{{ '/impressum/' | relative_url }}">Imprint</a><a href="{{ '/open-source/' | relative_url }}">Open-source Software</a><a href="https://github.com/BugCube">BugCube on GitHub</a></nav></footer>
</body>
</html>
